name: Debug Build
on:
  push:
    branches:
      - dev*
    paths:
      - "app/**"
      - "buildSrc/**"
      - "library/**"
      - ".github/workflows/debug.yml"
  workflow_dispatch:
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      # A push is the development cycle, so build only what gets installed.
      # A manual run builds every ABI and flavour, for a release.
      ABI_FILTERS: ${{ github.event_name == 'push' && 'arm64-v8a' || '' }}
      GOMOBILE_TARGET: ${{ github.event_name == 'push' && 'android/arm64' || 'android' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Checkout Core Submodule
        run: git submodule update --init library/core/deps/exclave-core
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27.3
          cache-dependency-path: "library/core/go.sum"
      - name: Setup Go Mobile
        # https://github.com/golang/mobile/blob/c31d5b91ecc32c0d598b8fe8457d244ca0b4e815/cmd/gomobile/init.go#L83
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20261011034528-197770444867
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20261011034528-197770444867
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 21
          cache: 'gradle'
      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r30
      - name: Native Build
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          ./run lib core debug
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          path: app/libs/libexclavecore.aar
          name: "LibExclaveCore"
      - name: Gradle Cache
        uses: actions/cache@v6
        with:
          path: ~/.gradle
          # The run id makes every run save an updated cache, so the task
          # outputs a build produces are there for the next one. Without it the
          # key never changes and the first cache is kept forever.
          key: gradle-debug-${{ hashFiles('**/*.gradle.kts') }}-${{ github.run_id }}
          restore-keys: |
            gradle-debug-${{ hashFiles('**/*.gradle.kts') }}-
            gradle-debug-
      - name: Gradle Build
        run: |
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          ./gradlew :app:downloadAssets
          ./gradlew :app:assembleOssDebug
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: APKs
          path: app/build/outputs/apk/oss/debug
      # Room writes the schema of the current database version here at build
      # time, and nothing else in this fork builds the app, so this is where
      # a new version's schema comes from to be committed. The schemas are not
      # a declared output of KSP, so a run taken from the build cache writes
      # none: KSP is run again for them.
      - name: Export Database Schemas
        run: ./gradlew :app:kspOssDebugKotlin --rerun
      - name: Upload Database Schemas
        uses: actions/upload-artifact@v7
        with:
          name: Schemas
          path: app/schemas
